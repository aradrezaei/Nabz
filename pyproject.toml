[project]
name = "nabz"
version = "1.0.0"
description = "سنجش ارزش تبلیغ در کانال عمومی اپ‌های داخلی، فقط از آمار قابل‌مشاهده"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx[socks]>=0.27,<1",
  "beautifulsoup4>=4.12",
  "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
nabz = "nabz.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nabz = ["fonts/*.woff2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
